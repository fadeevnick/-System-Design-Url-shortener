[compose_hosts]
compose-ec2 ansible_host=PRIVATE_IP_FROM_TERRAFORM ansible_user=ubuntu

[compose_hosts:vars]
ansible_ssh_private_key_file=~/.ssh/url-shortener-key.pem
image_uri=ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/url-shortener:replace-me
compose_replicas=12
pg_pool_max=20
aws_region=eu-central-1
database_secret_arn=arn:aws:secretsmanager:eu-central-1:ACCOUNT_ID:secret:url-shortener/database
registry_type=aws_ecr
registry_server=ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com
